name: 'divvy'
version: '1.0.0'
config-version: 2

profile: 'divvy'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  stockout_min_minutes: 5
  stale_minutes: 30
  near_l_km: 0.4
  rebalance_min_jump: 5
  rebalance_max_minutes: 10
  wet_precip_mm: 0.1
  inactive_max_changes: 10      # new: fewer bike-count changes than this over the window = likely inactive
  chronic_empty_pct: 0.5        # new: empty more than half of in-service time = chronically empty
  repeat_min_episodes: 20       # new: this many separate stockouts = repeat-stockout station
  flicker_window_minutes: 30

models:
  divvy:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    serving:                    # new
      +materialized: table
      +schema: serving